<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>역학적 에너지 보존 퀴즈 (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#16233D; --muted:#5E6B82; --line:#DCE2EC; --soft:#F2F5FA;
  --pe:#2F62D8; --pe-soft:#E8EFFD; --ke:#E08A00; --ke-soft:#FFF4DF;
  --ok:#11815A; --ok-soft:#E3F5EC; --no:#C8372D; --no-soft:#FCEBEA;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101726; --ink:#E9EEF7; --muted:#9AA6BB; --line:#2A3550; --soft:#18223A;
    --pe:#7FA3FF; --pe-soft:#1C2A4E; --ke:#FFB84D; --ke-soft:#3A2C12;
    --ok:#4FD19B; --ok-soft:#12352A; --no:#FF7D72; --no-soft:#3E1B1A;
  }
}
:root[data-theme="dark"]{
  --bg:#101726; --ink:#E9EEF7; --muted:#9AA6BB; --line:#2A3550; --soft:#18223A;
  --pe:#7FA3FF; --pe-soft:#1C2A4E; --ke:#FFB84D; --ke-soft:#3A2C12;
  --ok:#4FD19B; --ok-soft:#12352A; --no:#FF7D72; --no-soft:#3E1B1A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 32px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--pe);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:14px 0 12px;z-index:5}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.count span{color:var(--muted);font-weight:500}
.kind{font-size:13px;color:var(--muted)}
.home{border:0;background:none;padding:6px 0;font-size:14px;color:var(--muted);cursor:pointer}
.track{margin-top:10px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.track i{display:block;height:100%}

/* start */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.meter{display:flex;gap:6px;height:140px;align-items:flex-end;margin-bottom:32px}
.meter div{flex:1;border-radius:6px 6px 0 0}
.start h1{font-size:34px;line-height:1.25;margin:0 0 12px;letter-spacing:-.5px}
.start p{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 8px}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin:16px 0 36px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}

/* question */
.q{flex:1;display:flex;flex-direction:column}
.qtext{font-size:20px;line-height:1.55;font-weight:700;margin:18px 0 18px}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:18px;text-align:center}
.fig img{max-width:100%;max-height:34vh;height:auto;display:inline-block}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;text-align:left;
  padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);
  font-size:17px;cursor:pointer;transition:border-color .15s,background .15s}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--soft);font-size:14px;font-weight:700;color:var(--muted)}
.opt.sel{border-color:var(--pe);background:var(--pe-soft)}
.opt.sel .n{background:var(--pe);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .n{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .n{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.num{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:6px 16px;background:var(--bg)}
.num:focus-within{border-color:var(--pe)}
.num input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:24px;font-weight:700;padding:10px 0;outline:none;font-variant-numeric:tabular-nums}
.num span{color:var(--muted);font-size:18px}
.num.right{border-color:var(--ok);background:var(--ok-soft)}
.num.wrong{border-color:var(--no);background:var(--no-soft)}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px;line-height:1.6}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--no-soft)}
.fb strong{display:block;font-size:16px;margin-bottom:2px}
.fb.ok strong{color:var(--ok)} .fb.no strong{color:var(--no)}
.spacer{flex:1;min-height:20px}
.cta{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px))}
.btn{width:100%;height:56px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-size:17px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink);margin-top:10px}

/* result */
.res{flex:1;padding:32px 0}
.score{font-size:64px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:28px;color:var(--muted);letter-spacing:0;font-weight:500}
.res p{color:var(--muted);font-size:16px;margin:10px 0 28px}
.rate-label{font-size:15px;color:var(--muted);margin-bottom:6px}
.sub{font-size:17px;margin-top:10px;font-weight:500}
.bar{height:12px;border-radius:6px;background:var(--no-soft);overflow:hidden;margin:18px 0 14px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.split div{background:var(--soft);border-radius:12px;padding:12px 14px}
.split small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.split b{font-size:20px;font-variant-numeric:tabular-nums}
.split span{color:var(--muted);font-size:13px;margin-left:4px}
.redo{font-size:14px;color:var(--muted);margin:-10px 0 24px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:28px}
.grid button{aspect-ratio:1;border:0;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.grid .g-ok{background:var(--ok-soft);color:var(--ok)}
.grid .g-no{background:var(--no-soft);color:var(--no)}
.grid .g-skip{background:var(--soft);color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

 {t:"질량 5 kg인 물체가 2 m 위에 있다. 이 물체의 위치 에너지의 크기는 몇 J인가?",n:98,e:"9.8 × 5 × 2 = 98 J"},
 {t:"질량 2 kg인 물체가 2 m/s의 속력으로 날아가고 있다. 이 물체의 운동 에너지의 크기는 몇 J인가?",n:4,e:"½ × 2 × 2² = 4 J"},
 {t:"질량 4 kg인 물체가 2 m/s의 속력으로 날아가고 있다. 이 물체의 운동 에너지의 크기는 몇 J인가?",n:8,e:"½ × 4 × 2² = 8 J"},
 {t:"그림 속 물체의 위치 에너지의 크기는 몇 J인가?",f:"f6",n:196,e:"9.8 × 2 × 10 = 196 J"},
 {t:"그림 속 물체의 운동 에너지의 크기는 몇 J인가?",f:"f6",n:4,e:"½ × 2 × 2² = 4 J"},
 {t:"꼭대기 지점에서 물체의 위치 에너지의 크기는 몇 J인가?",f:"f8",n:98,e:"9.8 × 1 × 10 = 98 J"},
 {t:"꼭대기 지점에서 물체의 운동 에너지의 크기는 몇 J인가?",f:"f8",n:0,e:"정지 상태에서 출발하므로 속력이 0, 운동 에너지도 0 J입니다."},
 {t:"꼭대기 지점에서 물체의 역학적 에너지의 크기는 몇 J인가?",f:"f8",n:98,e:"역학적 에너지 = 위치 에너지 + 운동 에너지 = 98 + 0 = 98 J"},
 {t:"정지 상태에서 출발한 물체가 A에 도착했을 때 이 물체의 줄어든 위치 에너지의 크기는 몇 J인가?",f:"f8",n:19.6,e:"높이가 10 m에서 8 m로 2 m 낮아졌으므로 9.8 × 1 × 2 = 19.6 J"},
 {t:"정지 상태에서 출발한 물체가 A에 도착했을 때 이 물체의 운동 에너지의 크기는 몇 J인가?",f:"f8",n:19.6,e:"줄어든 위치 에너지만큼 운동 에너지로 바뀌므로 19.6 J입니다."},
 {t:"정지 상태에서 출발한 물체가 A에 도착했을 때 이 물체의 역학적 에너지의 크기는 몇 J인가?",f:"f8",n:98,e:"역학적 에너지는 보존되므로 처음과 같은 98 J입니다. (78.4 + 19.6 = 98)"},
 {t:"정지 상태에서 출발한 물체가 바닥인 A에 도착했을 때, 위치 에너지의 크기는 몇 J인가?",f:"f14",n:0,e:"바닥은 높이가 0이므로 위치 에너지는 0 J입니다."},
 {t:"정지 상태에서 출발한 물체가 바닥인 A에 도착했을 때, 운동 에너지의 크기는 몇 J인가?",f:"f14",n:98,e:"처음 위치 에너지 98 J가 모두 운동 에너지로 바뀌었습니다."},
 {t:"정지 상태에서 출발한 물체가 바닥인 A에 도착했을 때, 역학적 에너지의 크기는 몇 J인가?",f:"f14",n:98,e:"역학적 에너지는 보존되므로 98 J입니다."},
 {t:"바닥에서 던져 올려진 물체가 A를 통과하고 있다. A점에서 위치 에너지의 크기는 몇 J인지 고르시오.",f:"f17",o:MC_A,a:2,e:"A의 높이는 6 m이므로 9.8 × 1 kg × 6 m입니다."},
 {t:"바닥에서 던져 올려진 물체가 A를 통과하고 있다. A점에서 운동 에너지의 크기로 옳은 것을 고르시오.",f:"f17",o:MC_A,a:1,e:"역학적 에너지(9.8 × 1 × 10)에서 위치 에너지(9.8 × 1 × 6)를 빼면 9.8 × 1 kg × 4 m입니다."},
 {t:"던져 올려진 물체가 A를 통과하고 있다. A지점에서 역학적 에너지의 크기로 옳은 것을 고르시오.",f:"f17",o:MC_A,a:3,e:"최고 높이에서 운동 에너지가 0이므로, 역학적 에너지는 그때의 위치 에너지 9.8 × 1 kg × 10 m와 같고 어디서나 보존됩니다."},
 {t:"그림과 같이 던져 올려진 물체가 올라갔다가 내려오는 동안의 위치 에너지 변화로 옳은 것은? (단, 중력만 작용한다.)",f:"f20",o:MC_TREND,a:3,e:"높이가 올라갔다가 내려오므로 위치 에너지도 증가하다 감소합니다."},
 {t:"그림과 같이 던져 올려진 물체가 올라갔다가 내려오는 동안의 운동 에너지 변화로 옳은 것은? (단, 중력만 작용한다.)",f:"f20",o:MC_TREND,a:4,e:"올라가는 동안 느려지고 내려오는 동안 빨라지므로 운동 에너지는 감소하다 증가합니다."},
 {t:"그림과 같이 던져 올려진 물체가 올라갔다가 내려오는 동안의 역학적 에너지 변화로 옳은 것은? (단, 중력만 작용한다.)",f:"f20",o:MC_TREND,a:0,e:"중력만 작용하면 역학적 에너지는 보존되어 변하지 않습니다."},
 {t:"그림과 같이 던져 올려진 물체가 올라갔다가 내려오는 동안의 중력의 크기 변화로 옳은 것은?",f:"f23",o:MC_TREND,a:0,e:"중력의 크기는 9.8 × 질량으로, 물체의 위치나 움직임과 관계없이 일정합니다."},
 {t:"A, B, C 중에서 역학적 에너지의 크기가 가장 큰 곳은?",f:"f24",o:["A","B","C","모두 동일하다."],a:3,e:"역학적 에너지는 보존되므로 A, B, C 모두 같습니다."},
 {t:"A, B, C에서의 운동 에너지의 크기를 바르게 비교한 것은? (단, A와 C는 높이가 동일하다.)",f:"f24",o:["A > B > C","A = B = C","A = C > B","A = C < B"],a:2,e:"A와 C는 높이가 같아 위치 에너지가 같으므로 운동 에너지도 같고, 가장 높은 B에서 운동 에너지가 가장 작습니다."},
 {t:"A, B, C에서 중력의 방향이 다른 하나는?",f:"f24",o:["A","B","C","중력의 방향은 모두 동일하다."],a:3,e:"중력은 운동 방향과 관계없이 항상 지구 중심(아래) 방향으로 작용합니다."},
 {t:"최고 꼭대기 지점에서의 중력의 크기는?",f:"f27",o:MC_N,a:2,e:"중력의 크기 = 9.8 × 1 kg = 9.8 N. 꼭대기에서 멈춰 있어도 중력은 그대로 작용합니다."},
 {t:"C 지점에서 작용하는 중력의 크기는?",f:"f27",o:MC_N,a:2,e:"중력의 크기는 어디서나 9.8 × 1 kg = 9.8 N입니다."}
];

const app = document.getElementById("app");
let first = new Array(Q.length).fill(null);
let i = 0, ans = new Array(Q.length).fill(null), res = new Array(Q.length).fill(null), picked = null, checked = false, reviewOnly = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function track(){
  return '<div class="track">' + Q.map((_,k)=>{
    const c = res[k]===true?"var(--ok)":res[k]===false?"var(--no)":(k===i?"var(--ink)":"transparent");
    return `<i style="flex:1;background:${c}"></i>`;
  }).join("") + "</div>";
}

function startView(){
  const h=[38,54,70,86,100,86,70,54,38];
  app.innerHTML = `
  <div class="start">
    <div class="meter" aria-hidden="true">${h.map((v)=>`<div style="height:100%;display:flex;flex-direction:column;gap:0"><div style="flex:${100-v};background:var(--ke);border-radius:6px 6px 0 0;opacity:.9"></div><div style="flex:${v};background:var(--pe)"></div></div>`).join("")}</div>
    <h1>역학적 에너지 보존 퀴즈</h1>
    <p>위치 에너지와 운동 에너지가 바뀌어도, 둘의 합은 그대로일까요?</p>
    <p>${Q.length}문제 · 단답형은 숫자만 입력하세요. 중력 가속도는 9.8로 계산합니다.</p>
    <div class="legend"><span><b style="background:var(--pe)"></b>위치 에너지</span><span><b style="background:var(--ke)"></b>운동 에너지</span></div>
    <button class="btn" id="go">시작하기</button>
  </div>`;
  document.getElementById("go").onclick = ()=>{ i=0; ans.fill(null); res.fill(null); first.fill(null); reviewOnly=false; qView(); };
}

function qView(){
  const q = Q[i];
  checked = res[i]!==null; picked = ans[i];
  const isNum = q.n!==undefined;
  let body = "";
  if(isNum){
    const cls = checked ? (res[i]?"right":"wrong") : "";
    body = `<label class="num ${cls}"><input id="inp" inputmode="decimal" autocomplete="off" placeholder="정답 입력" value="${picked!==null?esc(picked):""}" ${checked?"disabled":""} aria-label="정답(숫자)"><span>J</span></label>`;
  } else {
    body = '<div class="opts">' + q.o.map((o,k)=>{
      let c="";
      if(checked){ if(k===q.a) c="right"; else if(k===picked) c="wrong"; }
      else if(k===picked) c="sel";
      return `<button class="opt ${c}" data-k="${k}" ${checked?"disabled":""}><span class="n">${k+1}</span><span>${esc(o)}</span></button>`;
    }).join("") + "</div>";
  }
  let fb = "";
  if(checked){
    const correct = isNum ? `${q.n}` : `${q.a+1}번 ${esc(q.o[q.a])}`;
    fb = res[i] ? `<div class="fb ok" role="status"><strong>정답이에요</strong>${esc(q.e)}</div>`
                : `<div class="fb no" role="status"><strong>정답: ${correct}</strong>${esc(q.e)}</div>`;
  }
  const last = i===Q.length-1;
  app.innerHTML = `
  <div class="top">
    <div class="toprow">
      <div class="count">${i+1}<span> / ${Q.length}</span></div>
      <div class="kind">${isNum?"단답형":"선택형"}</div>
      <button class="home" id="home">${reviewOnly?"결과로":"처음으로"}</button>
    </div>
    ${track()}
  </div>
  <div class="q">
    <div class="qtext">${esc(q.t)}</div>
    ${q.f?`<div class="fig"><img src="${FIG[q.f]}" alt="문제 그림"></div>`:""}
    ${body}
    ${fb}
    <div class="spacer"></div>
    <div class="cta">
      ${checked
        ? `<button class="btn" id="next">${reviewOnly?"결과로 돌아가기":(last?"결과 보기":"다음 문제")}</button>`
        : `<button class="btn" id="check" ${picked===null||picked===""?"disabled":""}>정답 확인</button>`}
    </div>
  </div>`;
  const fbEl = app.querySelector(".fb");
  if(fbEl && !reviewOnly) fbEl.scrollIntoView({block:"center"}); else window.scrollTo(0,0);
  document.getElementById("home").onclick = ()=> reviewOnly ? resultView() : startView();
  const chk = document.getElementById("check");
  if(isNum && !checked){
    const inp = document.getElementById("inp");
    inp.oninput = ()=>{ picked = inp.value.trim(); ans[i]=picked; chk.disabled = picked===""; };
    inp.onkeydown = e=>{ if(e.key==="Enter" && picked) grade(); };
  }
  if(!isNum && !checked){
    app.querySelectorAll(".opt").forEach(b=> b.onclick = ()=>{
      picked = +b.dataset.k; ans[i]=picked;
      app.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel", x===b));
      chk.disabled = false;
    });
  }
  if(chk) chk.onclick = grade;
  const nx = document.getElementById("next");
  if(nx) nx.onclick = ()=>{ if(reviewOnly) return resultView(); if(last) resultView(); else { i++; qView(); } };
}

function grade(){
  const q = Q[i];
  if(q.n!==undefined){
    const v = parseFloat(String(picked).replace(/,/g,"").replace(/\s|J/gi,""));
    res[i] = !isNaN(v) && Math.abs(v - q.n) < 0.001;
  } else res[i] = picked===q.a;
  if(first[i]===null) first[i] = res[i];
  qView();
}

function resultView(){
  const ok = first.filter(r=>r===true).length;
  const pct = Math.round(ok / Q.length * 100);
  const part = f => { const idx = Q.map((q,k)=>k).filter(k=>f(Q[k])); const c = idx.filter(k=>first[k]===true).length; return {c, n: idx.length, p: idx.length?Math.round(c/idx.length*100):0}; };
  const sa = part(q=>q.n!==undefined), mc = part(q=>q.n===undefined);
  const nowOk = res.filter(r=>r===true).length;
  const msg = pct===100 ? "모두 맞혔어요. 역학적 에너지 보존을 완벽하게 이해했네요."
            : pct>=70 ? "잘했어요. 틀린 문제만 다시 확인해 보세요."
            : "틀린 문제의 해설을 읽고 다시 도전해 보세요.";
  app.innerHTML = `
  <div class="res">
    <div class="rate-label">나의 정답률</div>
    <div class="score">${pct}<span>%</span></div>
    <div class="sub">${Q.length}문제 중 ${ok}문제 정답</div>
    <div class="bar" role="img" aria-label="정답률 ${pct}%"><i style="width:${pct}%"></i></div>
    <p>${msg}</p>
    <div class="split">
      <div><small>단답형</small><b>${sa.p}%</b><span>${sa.c}/${sa.n}</span></div>
      <div><small>선택형</small><b>${mc.p}%</b><span>${mc.c}/${mc.n}</span></div>
    </div>
    ${nowOk>ok?`<div class="redo">다시 풀어서 ${nowOk-ok}문제를 더 맞혔어요. 정답률은 처음 푼 결과로 계산해요.</div>`:""}
    <div class="grid">${Q.map((_,k)=>`<button class="${res[k]===true?"g-ok":res[k]===false?"g-no":"g-skip"}" data-k="${k}" aria-label="${k+1}번 문제 보기">${k+1}</button>`).join("")}</div>
    <button class="btn" id="again">다시 풀기</button>
    ${res.some(r=>r===false)?'<button class="btn ghost" id="retry">틀린 문제만 다시 풀기</button>':""}
  </div>`;
  window.scrollTo(0,0);
  app.querySelectorAll(".grid button").forEach(b=> b.onclick=()=>{ i=+b.dataset.k; reviewOnly=true; qView(); });
  document.getElementById("again").onclick = ()=>{ i=0; ans.fill(null); res.fill(null); first.fill(null); reviewOnly=false; qView(); };
  const r = document.getElementById("retry");
  if(r) r.onclick = ()=>{
    const wrong = res.map((v,k)=>v===false?k:-1).filter(k=>k>=0);
    wrong.forEach(k=>{ ans[k]=null; res[k]=null; });
    i = wrong[0]; reviewOnly=false; retryList = wrong; qViewRetry();
  };
}
let retryList = null;
function qViewRetry(){
  // walk only the questions that were wrong
  const origNext = ()=>{
    const pos = retryList.indexOf(i);
    if(pos < retryList.length-1){ i = retryList[pos+1]; qViewRetry(); } else { retryList=null; resultView(); }
  };
  qView();
  const hook = ()=>{
    const nx = document.getElementById("next");
    if(nx){ nx.textContent = retryList.indexOf(i)===retryList.length-1 ? "결과 보기" : "다음 문제"; nx.onclick = origNext; }
    const chk = document.getElementById("check");
    if(chk){ const g = chk.onclick; chk.onclick = ()=>{ g(); hook(); }; const inp=document.getElementById("inp"); if(inp){ inp.onkeydown = e=>{ if(e.key==="Enter" && picked){ grade(); hook(); } }; } }
  };
  hook();
}
startView();
</script>
</body>
</html>
